<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>AZOR — Otimização para jogos</title>
  <!--AZOR_TOKEN-->
  <link rel="icon" href="assets/Azor_icon.png">
  <link rel="stylesheet" href="azor.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="scoreGrad" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#ff66d9"/><stop offset="1" stop-color="#8b6cff"/></linearGradient>
      <linearGradient id="neon" x1="0" x2="1"><stop offset="0" stop-color="#ff2fc8"/><stop offset=".5" stop-color="#8b6cff"/><stop offset="1" stop-color="#ff2fc8"/></linearGradient>
    </defs>
  </svg>
  <div class="shell">
    <aside class="side">
      <div class="brand">
        <img src="assets/Azor_icon.png" alt="">
        <div><b>AZOR</b><span>OPTIMIZATION</span></div>
      </div>
      <nav class="nav" id="nav" aria-label="Seções"></nav>
      <div class="side-foot" id="sideFoot"></div>
    </aside>
    <section class="main">
      <header class="top">
        <div><h1 id="pageTitle">AZOR</h1><p id="pageSub"></p></div>
        <div class="top-right" id="topRight"></div>
      </header>
      <main class="view" id="view" tabindex="-1"></main>
    </section>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="modalRoot"></div>
  <script src="js/core.js"></script>
  <script src="js/pages/home.js"></script>
  <script src="js/pages/plan.js"></script>
  <script src="js/pages/tweaks.js"></script>
  <script src="js/pages/apps.js"></script>
  <script src="js/pages/cleanup.js"></script>
  <script src="js/pages/games.js"></script>
  <script src="js/pages/periph.js"></script>
  <script src="js/pages/hardware.js"></script>
  <script src="js/pages/repair.js"></script>
  <script src="js/pages/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
