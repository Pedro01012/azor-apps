<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>AZOR — Mesmo PC, mesmo jogo</title>
<style>
#cv{position:absolute;inset:0}
.lab{position:absolute;left:40px;font:400 104px Anton;letter-spacing:1px;text-shadow:0 6px 0 rgba(0,0,0,.6),0 0 30px rgba(0,0,0,.6);z-index:20}
#mid{position:absolute;left:0;right:0;top:930px;height:60px;z-index:25;display:flex;justify-content:center;align-items:center}
#mid span{background:#fff;color:#111;font:900 36px Mont;padding:10px 30px;border-radius:30px;box-shadow:0 6px 24px rgba(0,0,0,.6)}
</style></head><body><div id="stage">
<canvas id="cv" width="1080" height="1920"></canvas>
<div class="lab" id="l1" style="top:120px;color:#ff4155">SEM AZOR 😩</div>
<div class="lab" id="l2" style="top:1040px;color:#3dff9a">COM AZOR 😎</div>
<div id="mid"><span>MESMO PC · MESMO JOGO</span></div>
</div>
<script src="lib.js"></script>
<script>
AZ.init({dram: 'simulação ilustrativa'});
const T = {end: 11.6};
window.DURATION = 14.6;
const caps = AZ.caps([
  [0.1, 2.3, 'mesmo pc. mesmo jogo. olha a diferença 👇'],
  [2.3, 5.2, 'em cima: windows no ~padrão~'],
  [5.2, 8.2, 'embaixo: _1_ _clique_ no *azor*'],
  [8.2, 11.6, 'qual dos dois tu quer jogar? 👀'],
], 1530, {size: 66});
const end = AZ.endCard(T.end, 'Escolhe<br><span style="color:#3dff9a">o de baixo.</span>');
music(0, 'edm', T.end + 3, {bpm: 128});
sfx(0.02, 'hit', .9); sfx(0.02, 'whoosh', .6);
for (const g of [1.3, 2.9, 4.6, 6.9, 9.1, 10.6]) sfx(g, 'glitch', .45);
sfx(8.2, 'pop', .7);
const cv = $('cv').getContext('2d');
const FREEZE = [[1.3, 1.75], [2.9, 3.5], [4.6, 4.95], [6.9, 7.6], [9.1, 9.45], [10.6, 11.1]];
window.renderFrame = t => {
  let flash = 0, shake = 0;
  cv.fillStyle = '#000'; cv.fillRect(0, 0, W, H);
  // em cima: travando (poucas atualizações por segundo + congeladas)
  let gt = Math.floor(t * 8) / 8;
  const fz = FREEZE.find(([a, b]) => t >= a && t < b);
  if (fz) gt = Math.floor(fz[0] * 8) / 8;
  AZ.game(cv, 0, 0, W, 940, gt * 1.6 + 2);
  AZ.perf(cv, 710, 40, 1, fz ? fz[0] : gt, true);
  if (fz) { cv.fillStyle = 'rgba(255,40,60,.12)'; cv.fillRect(0, 0, W, 940);
    for (let i = 0; i < 4; i++) { const y = hash(Math.floor(t * 20) + i) * 900; cv.drawImage($('cv'), 0, y, W, 20, (hash(i + t) - .5) * 50, y, W, 20); } }
  // embaixo: liso
  AZ.game(cv, 0, 980, W, 940, t * 1.6 + 2);
  AZ.perf(cv, 710, 1020, 1, t, false);
  cv.fillStyle = '#000'; cv.fillRect(0, 940, W, 40);
  const k = eBack(prog(t, 0, .35));
  $('l1').style.transform = `scale(${lerp(1.6, 1, k)})`; $('l2').style.transform = `scale(${lerp(1.6, 1, eBack(prog(t, .15, .5)))})`;
  if (fz && t - fz[0] < .12) shake = 6;
  caps(t);
  end(t);
  AZ.post(t, flash, shake);
};
</script></body></html>
