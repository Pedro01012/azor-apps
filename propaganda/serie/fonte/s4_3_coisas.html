<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>AZOR — 3 coisas que roubam teu FPS</title>
<style>
#cv{position:absolute;inset:0}
#big3{position:absolute;left:0;right:0;top:330px;text-align:center;font:400 620px/1 Anton;color:#ff2fc8;text-shadow:0 0 80px rgba(255,47,200,.7),12px 0 0 rgba(80,230,255,.5),-12px 0 0 rgba(255,60,80,.5)}
.chip{position:absolute;left:0;right:0;top:170px;text-align:center}
.chip b{display:inline-flex;align-items:center;gap:22px;font:900 58px Mont;padding:16px 38px;border-radius:24px;background:#fff;color:#111;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.chip b i{font-style:normal;font:400 70px Anton;color:#ff2fc8}
#rows{position:absolute;left:80px;right:80px;top:820px}
.row{display:flex;align-items:center;gap:26px;height:150px;margin-bottom:24px;padding:0 34px;border-radius:30px;background:rgba(61,255,154,.1);border:3px solid rgba(61,255,154,.6);
  font:900 44px Mont}
.row .ck{width:84px;height:84px;border-radius:50%;background:#22d07a;display:grid;place-items:center;flex:none;box-shadow:0 0 30px rgba(61,255,154,.6)}
.row .ck svg{width:50px;height:50px;color:#fff}
.row small{display:block;font:700 28px Inter;color:#3dff9a;margin-top:4px}
#bst{position:absolute;left:340px;top:360px;width:400px;height:400px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle,#1a1420 60%,#0d0a12);box-shadow:0 0 0 14px rgba(255,47,200,.9),0 0 90px rgba(255,47,200,.8),inset 0 0 40px rgba(139,108,255,.4)}
#bst b{font:900 92px Mont;letter-spacing:8px;padding-left:8px}
#bst small{display:block;text-align:center;font:800 30px Mont;color:#ff66d9;letter-spacing:6px;margin-top:-6px}
</style></head><body><div id="stage">
<canvas id="cv" width="1080" height="1920"></canvas>
<div id="big3">3</div>
<div class="chip" id="c1"><b><i>#1</i> GRAVAÇÃO ESCONDIDA</b></div>
<div class="chip" id="c2"><b><i>#2</i> MONITOR NO HZ ERRADO</b></div>
<div class="chip" id="c3"><b><i>#3</i> TRANQUEIRA NO BOOT</b></div>
<div class="chip" id="c4"><b><i>⚡</i> A SOLUÇÃO</b></div>
<div id="bst"><div><b>BOOST</b><small>1 clique</small></div></div>
<div id="rows">
  <div class="row" id="r1"><div class="ck"><svg><use href="#check"/></svg></div><div>Gravação escondida<small>desligada</small></div></div>
  <div class="row" id="r2"><div class="ck"><svg><use href="#check"/></svg></div><div>Monitor<small>na taxa máxima</small></div></div>
  <div class="row" id="r3"><div class="ck"><svg><use href="#check"/></svg></div><div>Inicialização<small>sem tranqueira</small></div></div>
</div>
</div>
<script src="lib.js"></script>
<script>
AZ.init({dram: 'simulação ilustrativa'});
const T = {i1: 2.6, i2: 8.0, i3: 13.4, sol: 18.6, click: 19.3, end: 22.4};
window.DURATION = 25.4;
const caps = AZ.caps([
  [0.1, 1.4, '3 coisas ~roubando~ teu fps'],
  [1.4, 2.6, 'que ninguém te conta 🤫'],
  [2.6, 5.3, 'a game bar pode ficar ~gravando~ tua partida'],
  [5.3, 8.0, 'escondido. em segundo plano. o tempo todo.'],
  [8.0, 10.7, 'teu monitor de 144 hz pode tá em ~60~'],
  [10.7, 13.4, 'e tu joga a vida inteira assim sem saber'],
  [13.4, 16.0, 'um monte de app ~abrindo~ junto com o windows'],
  [16.0, 18.6, 'comendo tua ram antes do jogo abrir'],
  [18.6, 20.5, 'o *azor* resolve os 3 em _1_ _clique_'],
  [20.5, 22.4, 'e mais de *100* outros ajustes'],
], 1450, {size: 70});
const end = AZ.endCard(T.end, 'Salva esse vídeo<br><span style="color:#ff3fd0">e testa hoje.</span>');
music(0, 'trap', T.end + 3, {bpm: 140});
sfx(0.02, 'hit', 1); sfx(0.02, 'glitch', .8); sfx(1.4, 'pop', .6);
for (const t0 of [T.i1, T.i2, T.i3]) { sfx(t0, 'whoosh', .8); sfx(t0 + .05, 'stamp', .7); }
for (let k = 0; k < 8; k++) sfx(T.i1 + .5 + k * .6, 'rec', .35);
for (let k = 0; k < 9; k++) sfx(T.i3 + .4 + k * .45, 'pop', .55);
sfx(17.0, 'buzz', .6);
sfx(T.sol, 'riser', .7, {d: 1.2}); sfx(T.sol, 'whoosh', .7); sfx(T.click, 'click'); sfx(T.click, 'boost', 1);
for (let i = 0; i < 3; i++) sfx(T.click + .35 + i * .3, 'ding', .7);

const cv = $('cv').getContext('2d');
const APPS = ['Atualizador automático', 'Assistente de voz', 'Notícias e clima', 'Launcher de jogos', 'Sincronizador de nuvem', 'Widget do desktop', 'Ajudante de impressora', 'Atualizador de leitor PDF', 'Barra de ferramentas'];
window.renderFrame = t => {
  let flash = 0, shake = 0;
  const g = cv.createRadialGradient(540, 800, 50, 540, 960, 1300);
  const red = t < T.sol;
  g.addColorStop(0, red ? '#220812' : '#1a0a28'); g.addColorStop(1, '#050407');
  cv.fillStyle = g; cv.fillRect(0, 0, W, H);

  // gancho
  const hk = t < T.i1;
  show($('big3'), hk ? 1 - prog(t, T.i1 - .15, T.i1) : 0);
  if (hk) {
    AZ.game(cv, 0, 0, W, H, Math.floor(t * 8) / 8 * 1.2);
    cv.fillStyle = 'rgba(20,0,8,.72)'; cv.fillRect(0, 0, W, H);
    const k = eBack(prog(t, .02, .3), 2.4);
    const gl = Math.floor(t * 15) % 5 === 0 ? (hash(Math.floor(t * 15)) - .5) * 40 : 0;
    $('big3').style.transform = `translateX(${gl}px) scale(${lerp(2.2, 1, k)})`;
    shake = Math.max(0, 1 - prog(t, 0, .35)) * 26;
  }
  const chip = (id, a, b) => { const k = eBack(prog(t, a, a + .3)); show($(id), between(t, a, b) ? clamp((t - a) * 6) : 0); $(id).style.transform = `scale(${lerp(1.6, 1, k)})`; };
  chip('c1', T.i1, T.i2); chip('c2', T.i2, T.i3); chip('c3', T.i3, T.sol); chip('c4', T.sol, T.end);

  // #1 gravação escondida
  if (between(t, T.i1, T.i2)) {
    const k = eOut(prog(t, T.i1, T.i1 + .4));
    const x = 60, y = 420, w = 960, h = 540;
    cv.save(); cv.globalAlpha = k; cv.translate(0, (1 - k) * 80);
    AZ.game(cv, x, y, w, h, (t - T.i1) * 1.6);
    cv.strokeStyle = 'rgba(255,255,255,.15)'; cv.lineWidth = 3; cv.strokeRect(x, y, w, h);
    // REC
    const blink = Math.floor(t * 2) % 2 === 0;
    cv.fillStyle = 'rgba(0,0,0,.6)'; cv.beginPath(); cv.roundRect(x + w - 330, y + 24, 300, 70, 14); cv.fill();
    if (blink) { cv.fillStyle = '#ff2a3d'; cv.beginPath(); cv.arc(x + w - 290, y + 59, 16, 0, 6.283); cv.fill(); }
    const secs = 2832 + Math.floor((t - T.i1) * 1);
    cv.fillStyle = '#fff'; cv.font = '900 34px Orb'; cv.fillText('REC ' + new Date(secs * 1000).toISOString().substr(11, 8), x + w - 262, y + 72);
    // medidores
    const m = (lbl, yy, v, col) => {
      cv.fillStyle = 'rgba(255,255,255,.75)'; cv.font = '800 30px Mont'; cv.fillText(lbl, x, yy);
      cv.fillStyle = 'rgba(255,255,255,.1)'; cv.beginPath(); cv.roundRect(x, yy + 16, w, 26, 13); cv.fill();
      cv.fillStyle = col; cv.beginPath(); cv.roundRect(x, yy + 16, w * v, 26, 13); cv.fill();
    };
    const gr = prog(t, T.i1 + .4, T.i2 - .6);
    m('DISCO GRAVANDO EM SEGUNDO PLANO', y + h + 70, .2 + .7 * gr, '#ff4155');
    m('USO DA PLACA DE VÍDEO SÓ PRA GRAVAR', y + h + 160, .15 + .3 * gr + .05 * Math.sin(t * 9), '#ff9a3d');
    cv.restore();
  }
  // #2 monitor no Hz errado
  if (between(t, T.i2, T.i3)) {
    const k = eOut(prog(t, T.i2, T.i2 + .4));
    cv.save(); cv.globalAlpha = k;
    const panel = (y, label, hzv, smooth) => {
      cv.fillStyle = 'rgba(255,255,255,.05)'; cv.beginPath(); cv.roundRect(60, y, 960, 380, 26); cv.fill();
      cv.strokeStyle = smooth ? 'rgba(61,255,154,.6)' : 'rgba(255,65,85,.6)'; cv.lineWidth = 3; cv.stroke();
      cv.fillStyle = smooth ? '#3dff9a' : '#ff4155'; cv.font = '400 64px Anton'; cv.fillText(label, 100, y + 80);
      cv.fillStyle = 'rgba(255,255,255,.6)'; cv.font = '800 28px Mont'; cv.fillText(smooth ? 'o que teu monitor aguenta' : 'o que o windows deixou', 100, y + 122);
      // bolinha indo e voltando
      const rate = smooth ? 30 : 7;
      const tq = smooth ? t : Math.floor(t * rate) / rate;
      const pos = u => 160 + (Math.sin(u * 3.2) * .5 + .5) * 760;
      if (smooth) for (let i = 1; i <= 6; i++) { cv.fillStyle = `rgba(255,47,200,${.18 - i * .025})`; cv.beginPath(); cv.arc(pos(t - i * .012), y + 255, 52, 0, 6.283); cv.fill(); }
      cv.fillStyle = '#ff2fc8'; cv.shadowColor = '#ff2fc8'; cv.shadowBlur = 30;
      cv.beginPath(); cv.arc(pos(tq), y + 255, 52, 0, 6.283); cv.fill(); cv.shadowBlur = 0;
    };
    panel(330, '60 HZ', 60, false);
    panel(760, '144 HZ', 144, true);
    cv.restore();
  }
  // #3 tranqueira no boot
  if (between(t, T.i3, T.sol)) {
    const k = eOut(prog(t, T.i3, T.i3 + .3));
    cv.save(); cv.globalAlpha = k;
    cv.fillStyle = 'rgba(255,255,255,.06)'; cv.beginPath(); cv.roundRect(60, 300, 960, 1000, 28); cv.fill();
    cv.fillStyle = '#fff'; cv.font = '800 38px Inter'; cv.fillText('Abrindo com o Windows', 100, 370);
    APPS.forEach((a, i) => {
      const ti = T.i3 + .4 + i * .45; if (t < ti) return;
      const kk = eBack(prog(t, ti, ti + .25));
      const yy = 420 + i * 86;
      cv.save(); cv.translate(lerp(300, 0, kk), 0); cv.globalAlpha = clamp((t - ti) * 6) * k;
      cv.fillStyle = 'rgba(255,255,255,.07)'; cv.beginPath(); cv.roundRect(90, yy, 900, 70, 14); cv.fill();
      cv.fillStyle = `hsl(${i * 40},70%,60%)`; cv.beginPath(); cv.roundRect(108, yy + 14, 42, 42, 10); cv.fill();
      cv.fillStyle = '#fff'; cv.font = '700 32px Inter'; cv.fillText(a, 172, yy + 47);
      cv.fillStyle = '#ff4155'; cv.font = '800 24px Mont'; cv.fillText('ALTO IMPACTO', 790, yy + 45);
      cv.restore();
    });
    const ram = clamp(.35 + .6 * prog(t, T.i3 + .4, T.i3 + .4 + APPS.length * .45));
    cv.fillStyle = 'rgba(255,255,255,.8)'; cv.font = '800 30px Mont'; cv.fillText('MEMÓRIA RAM USADA', 100, 1230);
    cv.fillStyle = 'rgba(255,255,255,.1)'; cv.beginPath(); cv.roundRect(100, 1250, 880, 30, 15); cv.fill();
    cv.fillStyle = ram > .8 ? '#ff4155' : '#ff9a3d'; cv.beginPath(); cv.roundRect(100, 1250, 880 * ram, 30, 15); cv.fill();
    cv.restore();
    if (between(t, 17.0, 17.3)) shake = 12;
  }
  // solução
  const sv = between(t, T.sol, T.end);
  const sk = eBack(prog(t, T.sol + .1, T.sol + .45));
  const press = Math.max(0, 1 - Math.abs(t - T.click) / .1);
  show($('bst'), sv ? clamp((t - T.sol - .1) * 6) : 0);
  $('bst').style.transform = `scale(${lerp(.3, 1, sk) * (1 - press * .12) * (1 + .03 * Math.sin(t * 8))})`;
  if (sv) { AZ.blob(cv, 540, 560, 500, 420, '255,47,200', .35); const rk = prog(t, T.click, T.click + .5);
    if (rk > 0 && rk < 1) { cv.strokeStyle = `rgba(255,102,217,${1 - rk})`; cv.lineWidth = 10; cv.beginPath(); cv.arc(540, 560, 200 + rk * 400, 0, 6.283); cv.stroke(); } }
  ['r1', 'r2', 'r3'].forEach((id, i) => {
    const ti = T.click + .35 + i * .3, kk = eBack(prog(t, ti, ti + .3));
    show($(id), sv && t > ti ? 1 : 0); $(id).style.transform = `translateX(${(1 - kk) * 900}px)`;
  });
  if (between(t, T.click, T.click + .3)) { flash = .45 * (1 - prog(t, T.click, T.click + .3)); shake = Math.max(shake, 16); }
  document.querySelector('.dram').style.opacity = between(t, T.i2, T.i3) ? 1 : 0;
  caps(t);
  end(t);
  AZ.post(t, flash, shake);
};
</script></body></html>
