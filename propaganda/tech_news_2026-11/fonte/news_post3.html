<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>AZOR — Tech news (post)</title>
<style>
@font-face{font-family:Geist;font-weight:400;src:url(/node_modules/@fontsource/geist/files/geist-latin-400-normal.woff2)}
@font-face{font-family:Geist;font-weight:500;src:url(/node_modules/@fontsource/geist/files/geist-latin-500-normal.woff2)}
@font-face{font-family:Geist;font-weight:600;src:url(/node_modules/@fontsource/geist/files/geist-latin-600-normal.woff2)}
@font-face{font-family:Geist;font-weight:700;src:url(/node_modules/@fontsource/geist/files/geist-latin-700-normal.woff2)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px;overflow:hidden;background:#0d0c10}
#p{position:relative;width:1080px;height:1350px;overflow:hidden;background:#0d0c10;color:#f7f3fa;font-family:Geist,sans-serif;-webkit-font-smoothing:antialiased}
.x{position:absolute}
#hd{left:48px;right:48px;top:40px;display:flex;align-items:center;gap:18px}
#hd img{width:70px;height:70px;border-radius:50%;background:#141215;padding:10px}#hd b{color:#f7f3fa}#hd img{box-shadow:0 0 0 3px #ff3fc4}
#hd b{display:block;font:700 30px Geist}#hd span{display:block;font:400 24px Geist;color:rgba(247,243,250,.55);margin-top:2px}
#hd .dt{margin-left:auto;font:500 23px Geist;color:rgba(247,243,250,.55)}
#card{left:32px;right:32px;top:140px;bottom:118px;border-radius:44px;background:#17151b;box-shadow:inset 0 0 0 2px rgba(255,255,255,.05),0 24px 60px rgba(0,0,0,.45)}
#tg{left:84px;top:200px;display:flex;align-items:center;gap:12px;font:600 25px Geist}
#tg i{width:12px;height:12px;border-radius:50%;background:#ff3fbf;box-shadow:0 0 0 5px rgba(255,63,196,.25)}
h1{position:absolute;left:84px;font-weight:700;letter-spacing:-.04em;line-height:1.05}
mark{background:linear-gradient(#ff3fc4,#ff3fc4) no-repeat 0 96%;background-size:100% 7%;color:inherit;padding:0 .05em}
.ic{position:absolute}
.ol{position:absolute;left:84px;right:84px;display:flex;flex-direction:column;gap:16px}
.ol div{display:flex;gap:20px;align-items:flex-start;padding:26px 28px;border-radius:24px;background:#211e25;font:500 35px/1.3 Geist;letter-spacing:-.01em}
.ol i{flex:none;font:700 22px Geist;font-style:normal;width:42px;height:42px;border-radius:50%;background:#2e2a33;color:#f7f3fa;display:flex;align-items:center;justify-content:center;margin-top:2px}
.ol.big div{font-size:38px;padding:26px 28px;align-items:center}
.ol.big i{width:50px;height:50px;font-size:24px}
.sw{margin-left:auto;width:96px;height:54px;border-radius:30px;background:#4a464f;position:relative;flex:none}.sw:after{content:'';position:absolute;left:5px;top:5px;width:44px;height:44px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.25)}
.wn{position:absolute;left:84px;right:84px;font:500 27px/1.38 Geist;padding:22px 26px;border-radius:22px;background:#211e25;color:rgba(247,243,250,.75);box-shadow:inset 3px 0 0 #ff3fc4}
.cv{position:absolute;left:84px;right:84px;top:480px;display:flex;flex-direction:column;gap:18px}
.cv div{display:flex;flex-direction:column;gap:12px;padding:30px 30px;border-radius:26px;background:#211e25}
.cv small{display:flex;align-items:center;gap:10px;font:600 22px Geist;color:rgba(247,243,250,.55)}.cv small:before{content:'';width:10px;height:10px;border-radius:50%;background:#ff3fbf}
.cv span{font:700 42px/1.12 Geist;letter-spacing:-.03em}
#src{left:84px;right:84px;font:400 21px/1.35 Geist;color:rgba(247,243,250,.5)}
#ft{left:48px;right:48px;bottom:46px;display:flex;justify-content:space-between;font:500 24px Geist;color:rgba(247,243,250,.7)}
#ft>span:last-child{color:#ff6fd2}
#ft .pg{display:flex;align-items:center;gap:6px;font:600 24px Geist;color:rgba(247,243,250,.5)}#ft .pg em{font-style:normal;color:#f7f3fa}
#ft .dots{display:flex;gap:8px;margin-left:18px}#ft .dots b{width:10px;height:10px;border-radius:50%;background:rgba(247,243,250,.22)}#ft .dots b.on{background:#ff3fc4;width:28px;border-radius:5px}
.cv.c{gap:14px}.cv.c div{padding:22px 28px;gap:8px}.cv.c span{font-size:35px}
.big{position:absolute;left:84px;right:84px;font:700 112px/1 Geist;letter-spacing:-.05em}
.sub{position:absolute;left:84px;right:84px;font:500 38px/1.3 Geist;color:rgba(247,243,250,.7)}
.endc{position:absolute;left:32px;right:32px;top:140px;bottom:118px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.endc img{width:190px;height:190px;border-radius:50%;background:#141215;padding:26px;box-shadow:0 0 0 7px #ff3fc4}
.endc h2{font:700 84px/1.05 Geist;letter-spacing:-.04em;margin-top:56px}
.endc p{font:500 36px/1.4 Geist;color:rgba(247,243,250,.65);margin-top:22px}
.endc .bt{display:flex;gap:16px;margin-top:52px}.endc .bt span{font:700 34px Geist;padding:22px 40px;border-radius:999px;background:#f7f3fa;color:#141215}
.endc .bt span+span{background:transparent;color:#fff;box-shadow:inset 0 0 0 3px rgba(247,243,250,.3)}
.endc .tip{margin-top:60px;display:flex;gap:28px;font:500 28px Geist;color:rgba(247,243,250,.6)}
</style></head><body><div id="p"></div>
<script type="module">
import {STORIES} from '/news_data.js';
import {ICON as ICON0, AVATAR} from '/nat.js';
const DARK = svg => svg.replaceAll('#151316', '#e9e5ee').replaceAll('fill="#fff"', 'fill="#211e25"').replaceAll('#d9d4cd', '#3a3640').replaceAll('fill="#ff4fcf"', 'fill="#2e2a33"');
const ACCENT = {  // um único detalhe rosa por ícone
  shield: v => v.replace('<circle cx="150" cy="186" r="10" fill="#e9e5ee"/><rect x="146" y="190" width="8" height="24" rx="4" fill="#e9e5ee"/>', '<circle cx="150" cy="186" r="10" fill="#ff3fc4"/><rect x="146" y="190" width="8" height="24" rx="4" fill="#ff3fc4"/>'),
  gpu: v => v.replaceAll('r="12" fill="#e9e5ee"', 'r="12" fill="#ff3fc4"'),
  cal: v => v.replace('font-size="30" fill="#e9e5ee">NOV', 'font-size="30" fill="#ff3fc4">NOV'),
  cpu: v => v.replace('font-size="30" fill="#e9e5ee">18A-P', 'font-size="30" fill="#ff3fc4">18A-P'),
};
const ICON = Object.fromEntries(Object.entries(ICON0).map(([k, f]) => [k, () => ACCENT[k](DARK(f()))]));
const q = new URLSearchParams(location.search), s = STORIES[+q.get('s') || 0], v = q.get('v') || 'main', I = +q.get('i') || 1, NT = +q.get('n') || 7;
const mk = h => h.replace(/<em>/g, '<mark>').replace(/<\/em>/g, '</mark>');
const p = document.getElementById('p');
const base = `<div class="x" id="hd"><img src="${AVATAR}"><div><b>Azor Tweaks</b><span>@azortweaks · @azorwrld</span></div><div class="dt">Novidades da tecnologia</div></div><div class="x" id="card"></div>`;
const dots = Array.from({length: NT}, (_, k) => `<b class="${k + 1 === I ? 'on' : ''}"></b>`).join('');
const ft = I < NT ? `<div class="x" id="ft"><span class="pg"><em>${I}</em>/${NT}<span class="dots">${dots}</span></span><span>Deslize →</span></div>`
  : `<div class="x" id="ft"><span class="pg"><em>${I}</em>/${NT}<span class="dots">${dots}</span></span><span>Compartilhe com quem joga no PC</span></div>`;
if (v === 'cover') {
  p.innerHTML = base + `<div class="x" id="tg"><i></i>Últimos dias</div><h1 class="big" style="top:250px">Novidades da<br><mark>tecnologia</mark></h1>
    <div class="sub" style="top:500px">O que mudou no Windows, nas placas de vídeo, nos games e nos processadores.</div>
    <div class="cv c" style="top:640px">${STORIES.map((x, k) => `<div><small>${x.tag}</small><span>${x.head.replace(/<\/?em>/g, '')}</span></div>`).join('')}</div>` + ft;
} else if (v === 'end') {
  p.innerHTML = base + `<div class="x" id="card"></div><div class="endc"><img src="${AVATAR}"><h2>Siga a Azor</h2><p>As novidades que importam<br>para o seu PC, toda semana.</p>
    <div class="bt"><span>@azortweaks</span><span>@azorwrld</span></div><div class="tip"><span>Salve este post</span><span>·</span><span>Envie para quem joga no PC</span></div></div>` + ft;
} else if (v === 'how') {
  p.innerHTML = base + `<div class="x" id="tg"><i></i>${s.tag} · como conferir</div><h1 style="top:250px;right:84px;font-size:84px">Onde fica a <mark>opção</mark></h1>
    <div class="ol big" style="top:400px">${s.path.map((x, i) => `<div><i>${i + 1}</i>${x}${i === 3 ? '<span class="sw"></span>' : ''}</div>`).join('')}</div>
    <div class="wn" style="top:870px">Desativar remove uma camada de proteção do Windows. Se algum jogo exigir o recurso, mantenha ativo.</div>
    <h1 style="top:1040px;right:84px;font-size:52px">${mk(s.take)}</h1>` + ft;
} else {
  const wide = s.art === 'gpu';
  p.innerHTML = base + `<div class="x" id="tg"><i></i>${s.tag}</div><h1 id="h" style="top:250px;right:${wide ? 84 : 360}px;font-size:${s.head.length > 50 ? 72 : 82}px">${mk(s.head)}</h1>
    <div class="ic"></div><div class="ol">${s.facts.map((f, i) => `<div><i>${i + 1}</i><span>${f}</span></div>`).join('')}</div><div class="x" id="src">${s.src}</div>` + ft;
  const ic = p.querySelector('.ic'); ic.innerHTML = ICON[s.art]();
  if (wide) Object.assign(ic.style, {left: '310px', top: '430px', transform: 'scale(.72)', transformOrigin: '50% 0'});
  else Object.assign(ic.style, {left: '770px', top: '200px', transform: 'scale(.78)', transformOrigin: '0 0'});
  window.__lay = () => { const hb = p.querySelector('#h').getBoundingClientRect().bottom, ib = ic.getBoundingClientRect().bottom, ol = p.querySelector('.ol');
    ol.style.top = Math.max(hb, ib) + 40 + 'px'; p.querySelector('#src').style.top = ol.getBoundingClientRect().bottom + 26 + 'px'; };
}
window.renderFrame = () => {};
window.ready = async () => { await document.fonts.ready; await Promise.all(['400 40px Geist', '500 40px Geist', '600 40px Geist', '700 40px Geist'].map(f => document.fonts.load(f)));
  await Promise.all([...document.images].map(i => i.decode().catch(() => {}))); window.__lay && window.__lay(); return {D: 1}; };
</script></body></html>
