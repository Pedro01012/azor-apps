<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>AZOR — Tech news (post)</title>
<style>
@font-face{font-family:Geist;font-weight:400;src:url(/node_modules/@fontsource/geist/files/geist-latin-400-normal.woff2)}
@font-face{font-family:Geist;font-weight:500;src:url(/node_modules/@fontsource/geist/files/geist-latin-500-normal.woff2)}
@font-face{font-family:Geist;font-weight:600;src:url(/node_modules/@fontsource/geist/files/geist-latin-600-normal.woff2)}
@font-face{font-family:Geist;font-weight:700;src:url(/node_modules/@fontsource/geist/files/geist-latin-700-normal.woff2)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px;overflow:hidden;background:#ece8e2}
#p{position:relative;width:1080px;height:1350px;overflow:hidden;background:#ece8e2;color:#141215;font-family:Geist,sans-serif;-webkit-font-smoothing:antialiased}
.x{position:absolute}
#hd{left:48px;right:48px;top:40px;display:flex;align-items:center;gap:18px}
#hd img{width:70px;height:70px;border-radius:50%;background:#141215;padding:10px}
#hd b{display:block;font:700 30px Geist}#hd span{display:block;font:400 24px Geist;color:#6f6a70;margin-top:2px}
#hd .dt{margin-left:auto;font:500 23px Geist;color:#6f6a70}
#card{left:32px;right:32px;top:140px;bottom:118px;border-radius:44px;background:#fff;box-shadow:0 2px 0 rgba(20,18,21,.04),0 24px 60px rgba(60,40,50,.10)}
#tg{left:84px;top:200px;display:flex;align-items:center;gap:12px;font:600 25px Geist}
#tg i{width:12px;height:12px;border-radius:50%;background:#ff3fbf;box-shadow:0 0 0 5px #ffe0f4}
h1{position:absolute;left:84px;font-weight:700;letter-spacing:-.04em;line-height:1.05}
mark{background:linear-gradient(#ffc6ee,#ffc6ee) no-repeat 0 78%;background-size:100% 40%;color:inherit;padding:0 .05em}
.ic{position:absolute}
.ol{position:absolute;left:84px;right:84px;display:flex;flex-direction:column;gap:16px}
.ol div{display:flex;gap:20px;align-items:flex-start;padding:26px 28px;border-radius:24px;background:#f7f4f0;font:500 35px/1.3 Geist;letter-spacing:-.01em}
.ol i{flex:none;font:700 22px Geist;font-style:normal;width:42px;height:42px;border-radius:50%;background:#141215;color:#fff;display:flex;align-items:center;justify-content:center;margin-top:2px}
.ol.big div{font-size:38px;padding:26px 28px;align-items:center}
.ol.big i{width:50px;height:50px;font-size:24px}
.sw{margin-left:auto;width:96px;height:54px;border-radius:30px;background:#d9d4cd;position:relative;flex:none}.sw:after{content:'';position:absolute;left:5px;top:5px;width:44px;height:44px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.25)}
.wn{position:absolute;left:84px;right:84px;font:500 27px/1.38 Geist;padding:22px 26px;border-radius:22px;background:#fff1fa;color:#5b2a4c}
.cv{position:absolute;left:84px;right:84px;top:480px;display:flex;flex-direction:column;gap:18px}
.cv div{display:flex;flex-direction:column;gap:12px;padding:30px 30px;border-radius:26px;background:#f7f4f0}
.cv small{display:flex;align-items:center;gap:10px;font:600 22px Geist;color:#6f6a70}.cv small:before{content:'';width:10px;height:10px;border-radius:50%;background:#ff3fbf}
.cv span{font:700 42px/1.12 Geist;letter-spacing:-.03em}
#src{left:84px;right:84px;font:400 21px/1.35 Geist;color:#857f86}
#ft{left:48px;right:48px;bottom:46px;display:flex;justify-content:space-between;font:500 24px Geist}
#ft span:last-child{color:#c01f8e}
</style></head><body><div id="p"></div>
<script type="module">
import {STORIES} from '/news_data.js';
import {ICON, AVATAR} from '/nat.js';
const q = new URLSearchParams(location.search), s = STORIES[+q.get('s') || 0], v = q.get('v') || 'main';
const mk = h => h.replace(/<em>/g, '<mark>').replace(/<\/em>/g, '</mark>');
const p = document.getElementById('p');
const base = `<div class="x" id="hd"><img src="${AVATAR}"><div><b>Azor Tweaks</b><span>@azortweaks · @azorwrld</span></div><div class="dt">Tech news · nov. 2026</div></div><div class="x" id="card"></div>`;
const ft = `<div class="x" id="ft"><span>Salve para ver depois</span><span>Compartilhe com quem joga no PC</span></div>`;
if (v === 'cover') {
  p.innerHTML = base + `<div class="x" id="tg"><i></i>Resumo da semana</div><h1 style="top:250px;right:84px;font-size:88px">O que mudou na <mark>tecnologia</mark></h1>
    <div class="cv">${STORIES.map(x => `<div><small>${x.tag}</small><span>${x.head.replace(/<\/?em>/g, '')}</span></div>`).join('')}</div>
    <div class="x" id="src" style="top:1180px">Deslize para ver cada notícia →</div>` + ft;
} else if (v === 'how') {
  p.innerHTML = base + `<div class="x" id="tg"><i></i>${s.tag} · como conferir</div><h1 style="top:250px;right:84px;font-size:84px">Onde fica a <mark>opção</mark></h1>
    <div class="ol big" style="top:400px">${s.path.map((x, i) => `<div><i>${i + 1}</i>${x}${i === 3 ? '<span class="sw"></span>' : ''}</div>`).join('')}</div>
    <div class="wn" style="top:870px">Desativar remove uma camada de proteção do Windows. Se algum jogo exigir o recurso, mantenha ativo.</div>
    <h1 style="top:1040px;right:84px;font-size:52px">${mk(s.take)}</h1>` + ft;
} else {
  const wide = s.art === 'gpu';
  p.innerHTML = base + `<div class="x" id="tg"><i></i>${s.tag}</div><h1 id="h" style="top:250px;right:${wide ? 84 : 360}px;font-size:${s.head.length > 50 ? 72 : 82}px">${mk(s.head)}</h1>
    <div class="ic"></div><div class="ol">${s.facts.map((f, i) => `<div><i>${i + 1}</i><span>${f}</span></div>`).join('')}</div><div class="x" id="src">${s.src}</div>` + ft;
  const ic = p.querySelector('.ic'); ic.innerHTML = ICON[s.art]();
  if (wide) Object.assign(ic.style, {left: '310px', top: '430px', transform: 'scale(.72)', transformOrigin: '50% 0'});
  else Object.assign(ic.style, {left: '770px', top: '200px', transform: 'scale(.78)', transformOrigin: '0 0'});
  window.__lay = () => { const hb = p.querySelector('#h').getBoundingClientRect().bottom, ib = ic.getBoundingClientRect().bottom, ol = p.querySelector('.ol');
    ol.style.top = Math.max(hb, ib) + 40 + 'px'; p.querySelector('#src').style.top = ol.getBoundingClientRect().bottom + 26 + 'px'; };
}
window.renderFrame = () => {};
window.ready = async () => { await document.fonts.ready; await Promise.all(['400 40px Geist', '500 40px Geist', '600 40px Geist', '700 40px Geist'].map(f => document.fonts.load(f)));
  await Promise.all([...document.images].map(i => i.decode().catch(() => {}))); window.__lay && window.__lay(); return {D: 1}; };
</script></body></html>
