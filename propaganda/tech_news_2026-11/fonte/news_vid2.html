<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>AZOR — Tech news (vídeo natural)</title>
<style>html,body{width:1080px;height:1920px;overflow:hidden;background:#f5f3ef}#p{width:1080px;height:1920px}
#p .hd{top:90px}
.x{position:absolute;will-change:transform,opacity}
#tg{left:64px;top:250px}
#h{left:64px;right:64px;top:330px;font:700 96px/1.04 Geist;letter-spacing:-.035em}
#h2{left:64px;right:64px;top:330px;font:700 96px/1.04 Geist;letter-spacing:-.035em}
#tk{left:64px;right:64px;top:330px;font:700 92px/1.06 Geist;letter-spacing:-.035em}
.n mark{background:linear-gradient(#ff9fe3,#ff9fe3) no-repeat 0 72%;background-size:0% 42%;padding:0 .06em}
#ic{left:540px;top:1240px}
#ic>svg{position:absolute;transform:translate(-50%,-50%)}
#ol{left:64px;right:64px;display:flex;flex-direction:column}
#ol div{display:flex;gap:24px;align-items:flex-start;font:500 52px/1.26 Geist;letter-spacing:-.015em;padding:38px 0;border-top:3px solid #e2ded8}
#ol div:first-child{border-top:none}
#ol i{flex:none;font:700 30px Geist;font-style:normal;width:58px;height:58px;border-radius:50%;background:#ff4fcf;color:#fff;display:flex;align-items:center;justify-content:center;margin-top:4px}
#st{left:64px;right:64px;top:620px;display:flex;flex-direction:column;gap:24px}
#st div{display:flex;align-items:center;gap:24px;font:600 44px Geist;padding:32px 30px;border-radius:28px;background:#fff;border:4px solid #151316}
#st div i{flex:none;font:700 30px Geist;font-style:normal;width:60px;height:60px;border-radius:50%;background:#ff4fcf;color:#fff;display:flex;align-items:center;justify-content:center}
#st .sw{margin-left:auto;width:120px;height:66px;border-radius:36px;border:4px solid #151316;position:relative;flex:none}
#st .sw b{position:absolute;left:5px;top:5px;width:48px;height:48px;border-radius:50%;background:#fff;border:4px solid #151316}
#wn{left:64px;right:64px;top:1340px;font:500 36px/1.35 Geist;padding:28px 32px;border-radius:24px;background:#ffe3f6;color:#4a2140}
#src{left:64px;right:64px;bottom:120px;font:400 26px/1.35 Geist;color:#8a858b}
#end{left:0;right:0;top:0;bottom:0;background:#f5f3ef;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
#end img{width:200px;height:200px;border-radius:50%;background:#151316;padding:26px}
#end h3{font:700 84px/1.05 Geist;letter-spacing:-.035em;margin-top:56px}
#end p{font:500 40px Geist;color:#6f6a70;margin-top:26px}
#end .bt{margin-top:56px;font:700 40px Geist;padding:26px 52px;border-radius:999px;background:#151316;color:#f5f3ef}
</style></head><body><div id="p" class="n"></div>
<script type="module">
import {sfx, ease, prog, lerp, clamp} from '/kit.js';
import {STORIES} from '/news_data.js';
import {NAT_CSS, ICON, header, plain, AVATAR} from '/nat.js';
const st = document.createElement('style'); st.textContent = NAT_CSS; document.head.appendChild(st);
const s = STORIES[+new URLSearchParams(location.search).get('s') || 0], hasPath = !!s.path;
const one = h => plain(h).split('|').join(' ');
const p = document.getElementById('p');
p.innerHTML = header(90) + `<div class="tg x" id="tg">${s.tag.toLowerCase()}</div><h1 class="x" id="h">${one(s.head)}</h1><div class="x" id="ic">${ICON[s.art]()}</div>
  <div class="x" id="ol">${s.facts.map((f, i) => `<div><i>${i + 1}</i><span>${f}</span></div>`).join('')}</div>
  ${hasPath ? `<h1 class="x" id="h2">Onde fica a <mark>opção</mark></h1><div class="x" id="st">${s.path.map((x, i) => `<div><i>${i + 1}</i>${x}${i === 3 ? '<span class="sw"><b></b></span>' : ''}</div>`).join('')}</div>
  <div class="x" id="wn">Desligar tira uma camada de proteção. Se o jogo exigir, deixa ligada.</div>` : ''}
  <h1 class="x" id="tk">${one(s.take)}</h1><div class="x" id="src">${s.src}</div>
  <div class="x" id="end"><img src="${AVATAR}"><h3>Segue pra ficar<br>por dentro</h3><p>toda semana tem novidade</p><div class="bt">@azortweaks</div></div>`;
const $ = id => document.getElementById(id);
const T = {f0: 4.2, step: 2.3};
T.p = T.f0 + 3 * T.step + .6;
T.take = hasPath ? T.p + 3.4 : T.p;
T.end = T.take + 3.0;
const D = T.end + 3.0;

// som leve e baixo
sfx(0, 'pad', .6, {d: D, chords: [[60, 64, 67, 71, 74], [57, 64, 67, 72, 76], [55, 62, 67, 71, 74]]});
sfx(.3, 'pop', .7); sfx(.6, 'air', .5);
[0, 1, 2].forEach(i => sfx(T.f0 + i * T.step, 'pop', .8));
if (hasPath) { sfx(T.p, 'whoosh', .4, {d: .7}); [0, 1, 2, 3].forEach(i => sfx(T.p + .5 + i * .35, 'tick', .8)); sfx(T.p + 2.2, 'click', 1); }
sfx(T.take, 'whoosh', .4, {d: .7}); sfx(T.end, 'whoosh', .4, {d: .7}); sfx(T.end + .3, 'chime', .6);

const show = (e, k, dy = 30) => { e.style.opacity = k; e.style.transform = `translateY(${(1 - k) * dy}px)`; e.style.visibility = k > .001 ? 'visible' : 'hidden'; };
const inout = (t, a, b, d = .45) => ease.out(prog(t, a, a + d)) * (1 - ease.in(prog(t, b - .3, b)));
const marks = (root, t, t0) => root.querySelectorAll('mark').forEach(m => m.style.backgroundSize = `${ease.io(prog(t, t0, t0 + .6)) * 100}% 42%`);
let olTop = 0;
window.renderFrame = t => {
  if (!olTop) olTop = $('h').getBoundingClientRect().height + 330 + 70;
  const listEnd = T.p;
  // manchete
  show($('h'), inout(t, .2, listEnd)); marks($('h'), t, .9);
  show($('tg'), inout(t, .1, T.end));
  // ícone: grande no começo, sai quando a lista entra, volta no fim
  const icA = hasPath ? inout(t, .3, T.p) : inout(t, .3, T.end), icB = hasPath ? inout(t, T.take + .2, T.end) : 0;
  const tall = $('ol').getBoundingClientRect().height + olTop > 1480, hideMid = tall ? ease.io(prog(t, T.f0 - .4, T.f0)) * (1 - ease.io(prog(t, T.take - .2, T.take + .3))) : 0;
  const ic = $('ic'), icv = Math.max(icA * (1 - hideMid), icB); ic.style.opacity = icv; ic.style.visibility = icv > .001 ? 'visible' : 'hidden';
  const small = ease.io(prog(t, T.f0 - .4, T.f0 + .2)) * (1 - ease.io(prog(t, T.take - .2, T.take + .4)));
  const sc = lerp(.85, 1.25, ease.out(prog(t, .3, 1.0))) * lerp(1, .62, small);
  ic.style.top = lerp(1250, 1640, small) + 'px';
  ic.firstElementChild.style.transform = `translate(-50%,-50%) scale(${sc}) rotate(${Math.sin(t * 1.3) * 2}deg)`;
  if (s.art === 'gpu') ic.querySelectorAll('.fan').forEach(f => f.querySelector('.bl').setAttribute('transform', `rotate(${t * 240} ${f.dataset.x} 110)`));
  if (s.art === 'cal') ic.querySelector('.day').textContent = Math.max(1, Math.round(lerp(1, 19, ease.out(prog(t, .5, 1.6)))));
  if (s.art === 'cpu') ic.querySelector('.die').setAttribute('fill', `hsl(316,100%,${lerp(65, 78, (Math.sin(t * 3) + 1) / 2)}%)`);
  if (s.art === 'shield') ic.firstElementChild.style.transform += ` translateY(${Math.sin(t * 2) * 8}px)`;
  // lista de fatos, acumulando
  if (!olTop) olTop = $('h').getBoundingClientRect().height + 330 + 70;
  const ol = $('ol'); ol.style.top = olTop + 'px';
  const lv = t > T.f0 - .1 && t < listEnd; ol.style.visibility = lv ? 'visible' : 'hidden';
  [...ol.children].forEach((d, i) => show(d, inout(t, T.f0 + i * T.step, listEnd), 40));
  // caminho (só Windows)
  if (hasPath) { show($('h2'), inout(t, T.p + .1, T.take)); marks($('h2'), t, T.p + .6);
    const stv = t > T.p && t < T.take; $('st').style.visibility = stv ? 'visible' : 'hidden';
    [...$('st').children].forEach((d, i) => show(d, inout(t, T.p + .5 + i * .35, T.take), 40));
    const k = ease.out(prog(t, T.p + 2.2, T.p + 2.5)); $('st').querySelector('.sw b').style.transform = `translateX(${(1 - k) * 54}px)`;
    $('st').querySelector('.sw').style.background = k > .5 ? '#d9d4cd' : '#ff4fcf';
    show($('wn'), inout(t, T.p + 2.6, T.take)); }
  // conclusão
  show($('tk'), inout(t, T.take + .1, T.end)); marks($('tk'), t, T.take + .7);
  $('src').style.opacity = inout(t, 1.0, T.end) * .95;
  // fim
  const ek = ease.out(prog(t, T.end - .1, T.end + .4)); const end = $('end'); end.style.opacity = ek; end.style.visibility = ek > .001 ? 'visible' : 'hidden';
  end.querySelector('img').style.transform = `scale(${lerp(.8, 1, ease.back(prog(t, T.end, T.end + .6)))})`;
};
window.ready = async () => { await document.fonts.ready; await Promise.all(['400 40px Geist', '500 40px Geist', '600 40px Geist', '700 40px Geist'].map(f => document.fonts.load(f)));
  await Promise.all([...document.images].map(i => i.decode().catch(() => {}))); return {D}; };
</script></body></html>
