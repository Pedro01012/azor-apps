<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>AZOR — Por dentro do BOOST</title></head><body><div id="stage"></div>
<script type="module">
import {W, H, stage, background, post, headline, label, lockup, ring, sparkles, ready, keys, ease, prog, lerp, clamp, hash, sfx, $, el} from '/kit.js';
import {pcSVG, pcUpdate} from '/pc2d.js';
import {chip, note} from '/ui.js';

const {fx} = stage(`
.card{position:absolute;left:0;top:0;border-radius:30px;overflow:hidden;z-index:20;transform-origin:0 0;
  box-shadow:0 0 0 2px rgba(255,255,255,.14),0 60px 140px rgba(0,0,0,.75),0 0 120px rgba(255,47,200,.25)}
.card img{display:block}
.card canvas{position:absolute;left:0;top:0}
#cur{position:absolute;width:30px;height:44px;z-index:3;transform-origin:0 0}
`);
const D = 20.2;
const T = {s2: 3.2, go: 10.0, s3: 10.8, s4: 14.6, end: 17.2};
const ROWS = [[250, 65], [323, 85], [417, 85], [511, 66], [585, 66], [659, 86]];
const cam = el('div', 'cam'); cam.style.zIndex = 10; cam.innerHTML = pcSVG();
const svg = cam.querySelector('svg'); svg.style.position = 'absolute'; svg.style.transformOrigin = '0 0';
const md = el('div', 'card'); md.style.width = '640px'; md.style.height = '844px';
md.innerHTML = `<img src="/shots/modal_crop.png" width="640" height="844"><canvas width="640" height="844"></canvas>
  <svg id="cur" viewBox="0 0 16 24"><path d="M1 1 V19 L5.5 15 L9 22.5 L12 21.2 L8.6 13.8 H14 Z" fill="#fff" stroke="#000" stroke-width="1.2" stroke-linejoin="round"/></svg>`;
const mg = md.querySelector('canvas').getContext('2d'), cur = md.querySelector('#cur');
const rs = el('div', 'card'); rs.style.width = '860px'; rs.style.height = '471px'; rs.innerHTML = `<img src="/shots/result_crop.png" width="860" height="471">`;
const A = headline('O que o BOOST|faz em <em>1 clique?</em>', {top: 250, size: 108});
const L = label('AZOR OPTIMIZATION <b>·</b> 3.2', {top: 200});
const B = headline('Ele reconhece|o <em>seu</em> PC.', {top: 250, size: 104});
const Cc = headline('E tira o que|<em>pesa.</em>', {top: 250, size: 116});
const E = headline('No fim, você vê|o que <em>mudou.</em>', {top: 250, size: 100});
const nt = note('Tela real do AZOR · PC de teste · valores ilustrativos', 1850);
const F = headline('E tudo tem|<em>desfazer.</em>', {top: 250, size: 116});
const c1 = chip('Ponto de restauração antes de tudo', {top: 540});
const END = lockup('115 ajustes. Um clique.').anim(T.end);
const tRow = i => 6.2 + i * .52;

sfx(0, 'pad', .85, {d: D, chords: [[57, 64, 67, 71, 76], [53, 60, 64, 67, 72], [55, 62, 67, 71, 74], [60, 64, 67, 71, 76]]});
sfx(.4, 'air', .8); sfx(T.s2 - .2, 'whoosh', .6, {d: 1}); sfx(T.s2 + .6, 'scan', .45, {d: 1.8});
sfx(5.7, 'air', .6); ROWS.forEach((_, i) => sfx(tRow(i), 'tick', .8));
sfx(T.go - .9, 'riser', .7, {d: .9}); sfx(T.go, 'click', 1); sfx(T.go + .05, 'pop', .8);
sfx(T.s3 - .1, 'whoosh', .7, {d: 1}); sfx(T.s3 + .5, 'chime', .7); sfx(T.s3 + .9, 'count', .6, {d: 1});
sfx(T.s4 - .2, 'whoosh', .7, {d: 1}); sfx(T.s4 + .2, 'bloom', 1); sfx(T.s4 + .3, 'sparkle', .8, {d: 2});
sfx(T.end, 'whoosh', .5, {d: .9}); sfx(T.end + .5, 'tone', 1);

window.renderFrame = t => {
  fx.clearRect(0, 0, W, H);
  const pw = lerp(.15, 1, ease.out(prog(t, T.s4, T.s4 + 1.2)));
  const C = keys(t, [{t: 0, z: 1.3, cx: 400, cy: 480}, {t: T.s4, z: 1.12, cx: 400, cy: 470}, {t: T.s4 + .01, z: 1.4, cx: 385, cy: 420}, {t: T.end, z: 1.2, cx: 400, cy: 440}], ease.sine);
  svg.style.transform = `translate(${540 - C.cx * C.z}px,${1200 - C.cy * C.z}px) scale(${C.z})`;
  const back = ease.io(prog(t, T.s2 - .4, T.s2 + .4)) * (1 - ease.io(prog(t, T.s4 - .3, T.s4 + .2)));
  svg.style.filter = back > .01 ? `blur(${(back * 10).toFixed(1)}px) brightness(${(1 - back * .6).toFixed(2)})` : 'none';
  let a = 0; { const n = 200, dt = t / n; for (let i = 0; i < n; i++) a += lerp(.4, 8.5, ease.io(prog((i + .5) * dt, T.s4, T.s4 + 1.6))) * dt; }
  pcUpdate(svg, {power: pw, ang: a * 6.283, blur: clamp((pw - .5) * 2), t, flow: t > T.s4 ? ((t - T.s4) * .9) % 1.7 : -1, sweep: prog(t, 1.0, 2.6) || -1});
  background(t, {mood: .5 + .5 * pw});
  // modal real do BOOST
  const mi = ease.expo(prog(t, T.s2, T.s2 + .9)), mo = ease.in(prog(t, T.s3 - .4, T.s3 + .1)), mv = mi * (1 - mo);
  md.style.visibility = mv > .002 ? 'visible' : 'hidden';
  if (mv > .002) {
    // começa no pré-set (topo), desce pela lista e termina no botão
    const f = keys(t, [{t: T.s2, sc: 1.6, fx: 320, fy: 170}, {t: 5.6, sc: 1.6, fx: 320, fy: 190}, {t: 6.4, sc: 1.42, fx: 320, fy: 420}, {t: 9.0, sc: 1.42, fx: 320, fy: 470}, {t: 9.6, sc: 1.6, fx: 470, fy: 640}], ease.io);
    const sc = f.sc * lerp(.9, 1, mi) * lerp(1, 1.3, mo);
    md.style.transform = `translate(${540 - f.fx * sc}px,${lerp(1300, 1140, mi) - f.fy * sc}px) scale(${sc})`; md.style.opacity = mv; md.style.filter = mo > 0 ? `blur(${mo * 8}px)` : 'none';
    mg.clearRect(0, 0, 640, 844);
    // destaque do pré-set reconhecido
    const kp = ease.expo(prog(t, T.s2 + .7, T.s2 + 1.3)) * (1 - prog(t, 5.6, 6.0));
    if (kp > 0) { mg.save(); mg.shadowColor = '#ff2fc8'; mg.shadowBlur = 22; mg.strokeStyle = `rgba(255,110,225,${kp})`; mg.lineWidth = 3; mg.beginPath(); mg.roundRect(30, 143, 580 * kp, 95, 16); mg.stroke(); mg.restore(); }
    ROWS.forEach(([y, h], i) => { const k = ease.expo(prog(t, tRow(i), tRow(i) + .4)); if (k <= 0) return; const fade = 1 - .55 * prog(t, tRow(i) + .5, tRow(i) + 1);
      mg.save(); mg.shadowColor = '#ff2fc8'; mg.shadowBlur = 20; mg.strokeStyle = `rgba(255,110,225,${k * fade})`; mg.lineWidth = 3;
      mg.beginPath(); mg.roundRect(30, y, 580 * k, h, 14); mg.stroke(); mg.restore(); });
    const ck = ease.io(prog(t, 9.0, T.go - .05)), press = Math.max(0, 1 - Math.abs(t - T.go) / .08);
    cur.style.left = lerp(560, 500, ck) + 'px'; cur.style.top = lerp(980, 795, ck) + 'px'; cur.style.transform = `scale(${1.2 * (1 - press * .15)})`; cur.style.opacity = clamp(prog(t, 8.9, 9.1));
    const rk = prog(t, T.go, T.go + .5);
    if (rk > 0 && rk < 1) { mg.save(); mg.strokeStyle = `rgba(255,255,255,${1 - rk})`; mg.lineWidth = 3; mg.shadowColor = '#ff7fe0'; mg.shadowBlur = 20; mg.beginPath(); mg.arc(505, 791, 10 + rk * 140, 0, 6.283); mg.stroke(); mg.restore(); }
  }
  // resultado real
  const ri = ease.expo(prog(t, T.s3, T.s3 + .9)), ro = ease.in(prog(t, T.s4 - .35, T.s4 + .1)), rv = ri * (1 - ro);
  rs.style.visibility = rv > .002 ? 'visible' : 'hidden';
  if (rv > .002) { const z = ease.io(prog(t, T.s3 + 1.4, T.s4 - .4)), sc = lerp(1.12, 1.42, z) * lerp(.92, 1, ri) * lerp(1, 1.25, ro);
    const fx0 = 430, fy0 = lerp(235, 280, z);
    rs.style.transform = `translate(${540 - fx0 * sc}px,${lerp(1220, 1100, ri) - fy0 * sc}px) scale(${sc})`; rs.style.opacity = rv; rs.style.filter = ro > 0 ? `blur(${ro * 8}px)` : 'none'; }
  if (t > T.s3 + .5) sparkles(fx, t, T.s3 + .5, 540, 900, {n: 24, spread: 600, dur: 1.5, seed: 4});
  const [px, py] = [540 + (310 - C.cx) * C.z, 1200 + (300 - C.cy) * C.z];
  [0, .2].forEach(d => ring(fx, px, py, prog(t, T.s4 + .1 + d, T.s4 + 1.4 + d), {r1: 1000}));
  sparkles(fx, t, T.s4 + .2, px, py, {n: 30, spread: 420, dur: 1.7, seed: 9});
  A.anim(t, .4, T.s2 - .4, {stagger: .12}); L.anim(t, T.s2 + .1, T.s3 - .4); B.anim(t, T.s2 + .2, 5.6, {stagger: .12}); Cc.anim(t, 6.0, 8.9, {stagger: .12});
  E.anim(t, T.s3 + .1, T.s4 - .4, {stagger: .12}); nt.anim(t, T.s2 + .6, T.s4 - .4);
  F.anim(t, T.s4 + .2, T.end - .4, {stagger: .12}); c1.anim(t, T.s4 + .8, T.end - .4);
  END(t);
  post(t, {fade: Math.max(1 - ease.out(prog(t, 0, .5)), ease.io(prog(t, T.end - .3, T.end)) * (t < T.end ? 1 : 0)),
    flash: Math.max(.45 * (1 - prog(t, T.go, T.go + .3)) * (t >= T.go ? 1 : 0), .3 * Math.sin(Math.PI * prog(t, T.s4 + .1, T.s4 + .6)))});
};
window.ready = async () => { await ready(); return {D}; };
</script></body></html>
