<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>AZOR — Frametime</title></head><body><div id="stage"></div>
<script type="module">
import {W, H, stage, background, post, headline, label, lockup, ring, sparkles, ready, keys, ease, prog, lerp, clamp, hash, sfx, $, el} from '/kit.js';
import {pcSVG, pcUpdate} from '/pc2d.js';
import {chip, note, frametime} from '/ui.js';

const {fx} = stage(`
#gc{position:absolute;left:60px;top:700px;width:960px;height:700px;border-radius:44px;z-index:20;overflow:hidden;
  background:linear-gradient(160deg,rgba(40,22,52,.82),rgba(14,9,20,.9));border:1.5px solid rgba(255,255,255,.12);
  box-shadow:0 60px 140px rgba(0,0,0,.7),0 0 120px rgba(255,47,200,.18);backdrop-filter:blur(18px)}
#gc canvas{position:absolute;left:0;top:0}
#ro{position:absolute;left:44px;top:36px;right:44px;display:flex;justify-content:space-between;align-items:flex-end;z-index:2}
#ro .k{font:500 22px GeistMono;letter-spacing:.24em;text-transform:uppercase;color:rgba(247,243,250,.6)}
#ro .v{font:600 76px/1 Geist;letter-spacing:-.04em;color:#f7f3fa;text-align:right}
#ro .v small{display:block;font:500 26px GeistMono;letter-spacing:.06em;color:#ff8ae2;margin-top:8px}
`);
const D = 19.6;
const T = {s2: 3.6, sw0: 7.4, sw1: 8.7, s3: 9.0, s4: 12.8, end: 16.6};
const cam = el('div', 'cam'); cam.style.zIndex = 10; cam.innerHTML = pcSVG();
const svg = cam.querySelector('svg'); svg.style.position = 'absolute'; svg.style.transformOrigin = '0 0';
const gc = el('div'); gc.id = 'gc'; gc.innerHTML = `<canvas width="960" height="700"></canvas><div id="ro"><div class="k">Frametime<br><b class="st">antes</b></div><div class="v"><span class="ms">34,0 ms</span><small class="fps">≈ 29 fps</small></div></div>`;
const g = gc.querySelector('canvas').getContext('2d');
const N = 260, BEFORE = frametime(N * 3, {base: 30, jit: 9, spikes: .055, seed: 4}), AFTER = frametime(N * 3, {base: 7.9, jit: 1.3, spikes: 0, seed: 9});
const GX0 = 120, GX1 = 920, GY0 = 210, GY1 = 650, MS = 62;
const y = ms => GY1 - Math.min(ms, MS) / MS * (GY1 - GY0);

const A = headline('Isso é o seu|jogo <em>travando.</em>', {top: 250, size: 112});
const B = headline('Cada pico é uma|<em>engasgada</em> no meio|da partida.', {top: 250, size: 92});
const Cc = headline('Linha baixa e reta:|jogo <em>liso.</em>', {top: 250, size: 104});
const L = label('FRAMETIME <b>·</b> ANTES E DEPOIS', {top: 200});
const E = headline('Serviços, Game DVR,|GPU e timer|<em>no ponto.</em>', {top: 250, size: 96});
const nt = note('Ilustração comparativa, como no site · não é medição de um PC específico · o ganho varia conforme o hardware', 1440);
nt.style.lineHeight = '1.7';
const END = lockup('PC afinado. Jogo liso.', 'TWEAKS').anim(T.end);

// picos (para tremor e som)
const SPIKES = []; for (let i = 0; i < N * 3; i++) if (BEFORE[i] > 44) SPIKES.push(i);
const speed = 70;   // amostras por segundo rolando
const spikeTimes = SPIKES.map(i => (i - N) / speed + .3).filter(tt => tt > .5 && tt < T.sw0);
sfx(0, 'pad', .8, {d: D, chords: [[52, 59, 62, 66, 71], [55, 62, 66, 69, 74], [60, 64, 67, 71, 76]]});
spikeTimes.forEach(tt => sfx(tt, 'tick', .5));
sfx(.4, 'air', .8); sfx(T.s2 - .2, 'whoosh', .5, {d: .8});
sfx(T.sw0 - .3, 'riser', .7, {d: .9}); sfx(T.sw0, 'scan', .6, {d: 1.4}); sfx(T.sw1, 'bloom', 1); sfx(T.sw1 + .05, 'sparkle', .8, {d: 2});
sfx(T.s3 + .5, 'count', .7, {d: .9}); sfx(T.s4 - .2, 'whoosh', .7, {d: 1});
sfx(T.s4 + .3, 'sparkle', .6, {d: 1.8});
sfx(T.end, 'whoosh', .5, {d: .9}); sfx(T.end + .5, 'tone', 1);

const fmt = v => v.toFixed(1).replace('.', ',');
window.renderFrame = t => {
  fx.clearRect(0, 0, W, H);
  // PC ao fundo
  const pw = lerp(.15, 1, ease.out(prog(t, T.sw1, T.sw1 + 1.2)));
  const C = keys(t, [{t: 0, z: 1.25, cx: 400, cy: 470}, {t: T.s4, z: 1.15, cx: 400, cy: 480}, {t: T.s4 + .01, z: 1.4, cx: 380, cy: 420}, {t: T.end, z: 1.22, cx: 395, cy: 440}], ease.sine);
  svg.style.transform = `translate(${540 - C.cx * C.z}px,${1080 - C.cy * C.z}px) scale(${C.z})`;
  const gin = ease.expo(prog(t, .1, .9)), gout = ease.in(prog(t, T.s4 - .4, T.s4 + .1)), gv = gin * (1 - gout);
  svg.style.filter = gv > .01 ? `blur(${(gv * 10).toFixed(1)}px) brightness(${(1 - gv * .55).toFixed(2)})` : 'none';
  let a = 0; { const n = 200, dt = t / n; for (let i = 0; i < n; i++) { const u = (i + .5) * dt; a += lerp(.45, 8.5, ease.io(prog(u, T.sw1, T.sw1 + 1.6))) * dt; } }
  pcUpdate(svg, {power: pw, ang: a * 6.283, blur: clamp((pw - .5) * 2), t, flow: t > T.s4 ? ((t - T.s4) * .9) % 1.7 : -1});
  background(t, {mood: .5 + .5 * pw});
  // cartão do gráfico
  gc.style.visibility = gv > .002 ? 'visible' : 'hidden';
  let shake = 0;
  spikeTimes.forEach(st => { const k = (t - st) / .18; if (k > 0 && k < 1) shake = Math.max(shake, 1 - k); });
  gc.style.transform = `translate(${(hash(Math.floor(t * 30)) - .5) * 14 * shake}px,${lerp(80, 0, gin) + (hash(Math.floor(t * 30) + 5) - .5) * 10 * shake}px) scale(${lerp(.94, 1, gin) * lerp(1, 1.06, gout)})`;
  gc.style.opacity = gv;
  if (gv > .002) {
    g.clearRect(0, 0, 960, 700);
    // grade com as faixas de fps
    g.font = '500 22px GeistMono'; g.textAlign = 'right';
    [[8.3, '120 fps'], [16.7, '60 fps'], [33.3, '30 fps']].forEach(([ms, s]) => { g.strokeStyle = 'rgba(255,255,255,.09)'; g.lineWidth = 2; g.setLineDash([6, 10]);
      g.beginPath(); g.moveTo(GX0, y(ms)); g.lineTo(GX1, y(ms)); g.stroke(); g.setLineDash([]); g.fillStyle = 'rgba(247,243,250,.42)'; g.fillText(s, GX0 - 16, y(ms) + 8); });
    // linha: rola da direita para a esquerda; a varredura troca "antes" por "depois"
    const off = Math.floor((t + .3) * speed), frac = (t + .3) * speed - off;
    const sx = lerp(GX0 - 40, GX1 + 60, ease.io(prog(t, T.sw0, T.sw1)));
    const pts = [];
    for (let i = 0; i <= N; i++) { const x = GX0 + (i - frac) / N * (GX1 - GX0); if (x < GX0) continue;
      const idx = i + off, after = x < sx;
      pts.push([x, y(after ? AFTER[idx % AFTER.length] : BEFORE[idx % BEFORE.length]), after]); }
    // brilho e traço
    const draw = (sel, col, w, blur) => { g.save(); g.lineJoin = 'round'; g.strokeStyle = col; g.lineWidth = w; g.shadowColor = col; g.shadowBlur = blur; g.beginPath();
      let on = false; pts.forEach(([x, yy, af]) => { if (af === sel) { if (!on) { g.moveTo(x, yy); on = true; } else g.lineTo(x, yy); } else on = false; }); g.stroke(); g.restore(); };
    draw(false, 'rgba(255,170,200,.9)', 4, 10);
    draw(true, '#ff5fd8', 6, 26); draw(true, 'rgba(255,255,255,.9)', 2, 0);
    // preenchimento suave sob a linha "depois"
    // varredura
    if (t > T.sw0 && t < T.sw1 + .2) { const gr = g.createLinearGradient(sx - 90, 0, sx + 10, 0); gr.addColorStop(0, 'rgba(255,95,216,0)'); gr.addColorStop(1, 'rgba(255,200,245,.55)');
      g.fillStyle = gr; g.fillRect(sx - 90, GY0 - 30, 100, GY1 - GY0 + 40); g.fillStyle = '#fff'; g.fillRect(sx - 2, GY0 - 30, 4, GY1 - GY0 + 40); }
    // leitura
    const k = ease.io(prog(t, T.s3 + .5, T.s3 + 1.4)), ms = lerp(34, 7.9, k);
    gc.querySelector('.ms').textContent = fmt(ms) + ' ms'; gc.querySelector('.fps').textContent = '≈ ' + Math.round(1000 / ms) + ' fps';
    gc.querySelector('.st').textContent = t < T.sw1 ? 'antes' : 'depois'; gc.querySelector('.st').style.color = t < T.sw1 ? 'rgba(247,243,250,.85)' : '#ff8ae2';
  }
  // flash de cada pico
  if (shake > 0) { fx.save(); fx.fillStyle = `rgba(255,60,120,${.12 * shake})`; fx.fillRect(0, 0, W, H); fx.restore(); }
  if (t > T.sw1 && t < T.sw1 + 1.6) sparkles(fx, t, T.sw1, 980, 1100, {n: 26, spread: 380, dur: 1.5, seed: 3});
  const [px, py] = [540 + (310 - C.cx) * C.z, 1080 + (300 - C.cy) * C.z];
  [0, .2].forEach(d => ring(fx, px, py, prog(t, T.s4 + .1 + d, T.s4 + 1.4 + d), {r1: 1000}));
  A.anim(t, .5, T.s2 - .3, {stagger: .12}); B.anim(t, T.s2 + .1, T.sw0 - .2, {stagger: .12}); Cc.anim(t, T.s3, T.s4 - .4, {stagger: .12});
  L.anim(t, .9, T.s4 - .4); E.anim(t, T.s4 + .2, T.end - .4, {stagger: .12});
  nt.anim(t, 1.0, T.s4 - .4);
  END(t);
  post(t, {fade: Math.max(1 - ease.out(prog(t, 0, .5)), ease.io(prog(t, T.end - .3, T.end)) * (t < T.end ? 1 : 0)), flash: .35 * Math.sin(Math.PI * prog(t, T.sw1 - .1, T.sw1 + .4))});
};
window.ready = async () => { await ready(); return {D}; };
</script></body></html>
