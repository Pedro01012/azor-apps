<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>AZOR — Antes de comprar</title></head><body><div id="stage"></div>
<script type="module">
import {W, H, stage, background, post, headline, label, lockup, ring, sparkles, ready, keys, ease, prog, lerp, clamp, hash, sfx, $, el} from '/kit.js';
import {pcSVG, pcUpdate, gpuSVG, gpuUpdate} from '/pc2d.js';

const {fx} = stage(`
#gwrap{position:absolute;left:40px;top:860px;width:1000px;height:420px;z-index:12;perspective:1600px}
#gwrap svg{position:absolute;left:0;top:0;transform-origin:50% 50%}
#card{position:absolute;left:0;top:0;width:1600px;height:1500px;border-radius:30px;overflow:hidden;z-index:20;transform-origin:0 0;
  box-shadow:0 0 0 2px rgba(255,255,255,.14),0 60px 140px rgba(0,0,0,.75),0 0 120px rgba(255,47,200,.25)}
#card img{width:1600px;height:1500px;display:block}
#card canvas{position:absolute;left:0;top:0;width:1600px;height:1500px}
#note{position:absolute;left:84px;top:1500px;font:500 20px GeistMono;letter-spacing:.28em;color:rgba(247,243,250,.45);text-transform:uppercase;z-index:50}
`);
const D = 19.0;
const T = {s2: 4.2, s3: 8.2, s4: 12.2, end: 16.0};
// PC (cena final)
const cam = el('div', 'cam'); cam.style.zIndex = 10; cam.innerHTML = pcSVG();
const svg = cam.querySelector('svg'); svg.style.position = 'absolute'; svg.style.transformOrigin = '0 0';
// placa de vídeo
const gw = el('div'); gw.id = 'gwrap'; gw.innerHTML = gpuSVG(); const gsvg = gw.querySelector('svg');
// cartão do Diagnóstico
const card = el('div'); card.id = 'card'; card.innerHTML = `<img src="/shots3/plan_before_tall.png"><canvas width="1600" height="1500"></canvas>`;
const hc = card.querySelector('canvas').getContext('2d');
const ROWS = [[519, 110, 9.0], [637, 110, 9.9], [755, 110, 10.8]];   // XMP, canal único, apps inúteis
const note = el('div', '', $('stage'), 'Tela real do AZOR · PC de teste'); note.id = 'note';

let C = {z: 1.2, cx: 400, cy: 490};
const P = (x, y) => [540 + (x - C.cx) * C.z, 1080 + (y - C.cy) * C.z];
function fanAngle(t, t0, dur, r0, r1) { const sp = u => lerp(r0, r1, ease.io(prog(u, t0, t0 + dur))); let a = 0; const n = 200, dt = t / n; for (let i = 0; i < n; i++) a += sp((i + .5) * dt) * dt; return {ang: a * Math.PI * 2, rps: sp(t)}; }

const A = headline('Antes de gastar|<em>milhares</em> numa|placa nova,', {top: 250, size: 106});
const B = headline('veja o que está|<em>segurando</em> a sua.', {top: 250, size: 100});
const L1 = label('AZOR <b>·</b> DIAGNÓSTICO', {top: 200});
const Cc = headline('3 problemas.|<em>Nenhuma</em> peça nova.', {top: 250, size: 96});
const E = headline('Às vezes, o upgrade|que faltava era de|<em>configuração.</em>', {top: 250, size: 92});
const END = lockup('Descubra antes de gastar.').anim(T.end);

sfx(0, 'pad', .8, {d: D, chords: [[55, 62, 66, 69, 74], [57, 64, 67, 71, 76], [60, 64, 67, 71, 74]]});
sfx(.4, 'sparkle', .4, {d: 2.4}); sfx(.5, 'air', .8); sfx(1.4, 'scan', .4, {d: 1.6});
sfx(T.s2 - .2, 'whoosh', .7, {d: 1}); sfx(T.s2 + .2, 'tick', 1); sfx(4.5, 'air', .8);
sfx(T.s3 - .1, 'whoosh', .5, {d: .8}); ROWS.forEach(r => sfx(r[2], 'pop', .9)); sfx(8.5, 'air', .8);
sfx(T.s4 - .2, 'whoosh', .7, {d: 1}); sfx(T.s4 + .3, 'bloom', 1); sfx(T.s4 + .35, 'sparkle', .8, {d: 2.2}); sfx(12.7, 'air', .8);
sfx(T.end, 'whoosh', .5, {d: .9}); sfx(T.end + .5, 'tone', 1);

window.renderFrame = t => {
  fx.clearRect(0, 0, W, H);
  // ---- cena 1: placa de vídeo girando em 2.5D ----
  const gv = t < T.s2 + .4;
  gw.style.visibility = gv ? 'visible' : 'hidden';
  if (gv) {
    const k = prog(t, 0, T.s2);
    const out = ease.in(prog(t, T.s2 - .2, T.s2 + .3));
    gsvg.style.transform = `rotateY(${lerp(-24, 18, ease.sine(k))}deg) rotateX(${lerp(8, 4, k)}deg) scale(${lerp(.98, 1.06, k) * lerp(1, 1.5, out)})`;
    gw.style.opacity = 1 - out; gw.style.filter = out > 0 ? `blur(${out * 10}px)` : 'none';
    gpuUpdate(gsvg, {power: 1, ang: t * 7});
    // luz que varre a placa
    const sk = prog(t, 1.2, 3.0);
    if (sk > 0 && sk < 1) { fx.save(); fx.globalCompositeOperation = 'lighter'; const x = lerp(-100, 1200, ease.io(sk));
      const g = fx.createLinearGradient(x - 120, 0, x + 120, 0); g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(.5, 'rgba(255,230,250,.22)'); g.addColorStop(1, 'rgba(255,255,255,0)');
      fx.fillStyle = g; fx.translate(0, 0); fx.fillRect(x - 120, 860, 240, 420); fx.restore(); }
    sparkles(fx, t, .3, 540, 1070, {n: 18, spread: 460, dur: 2.2, seed: 9});
  }
  // ---- cenas 2 e 3: Diagnóstico real ----
  const cin = ease.expo(prog(t, T.s2, T.s2 + .9)), cout = ease.in(prog(t, T.s4 - .3, T.s4 + .2)), cv = cin * (1 - cout);
  card.style.visibility = cv > .002 ? 'visible' : 'hidden';
  if (cv > .002) {
    const pan = ease.io(prog(t, T.s2 + .4, T.s3)), zin = ease.io(prog(t, T.s3, T.s3 + .8));
    const sc = lerp(.74, .82, pan) * lerp(1, 1.3, zin) * lerp(1, 1.25, cout);
    const fxp = lerp(800, 700, pan) - 120 * zin, fyp = lerp(330, 600, pan) + 90 * zin + 60 * ease.sine(prog(t, T.s3 + .8, T.s4));
    card.style.transform = `translate(${540 - fxp * sc}px,${lerp(1260, 1120, cin) - fyp * sc}px) scale(${sc})`;
    card.style.opacity = cv; card.style.filter = cout > 0 ? `blur(${cout * 8}px)` : 'none';
    hc.clearRect(0, 0, 1600, 1500);
    const dim = ease.out(prog(t, 8.7, 9.2));
    if (dim > 0) {
      hc.fillStyle = `rgba(4,3,8,${.6 * dim})`; hc.beginPath(); hc.rect(0, 0, 1600, 1500);
      ROWS.forEach(([y, h, tm]) => { if (t > tm) hc.roundRect(286, y + 2, 1280, h - 4, 18); }); hc.fill('evenodd');
      ROWS.forEach(([y, h, tm]) => { const k = ease.expo(prog(t, tm, tm + .5)); if (k <= 0) return;
        hc.save(); hc.shadowColor = '#ff2fc8'; hc.shadowBlur = 24; hc.strokeStyle = `rgba(255,110,225,${k})`; hc.lineWidth = 4;
        hc.beginPath(); hc.roundRect(286, y + 2, 1280 * k, h - 4, 18); hc.stroke(); hc.restore(); });
    }
  }
  note.style.opacity = t > T.s2 + .3 && t < T.s4 - .2 ? .9 : 0;
  // ---- cena 4: o PC acordado ----
  const pv = t > T.s4 - .3;
  cam.style.visibility = pv ? 'visible' : 'hidden';
  C = keys(t, [{t: T.s4 - .3, z: 1.5, cx: 380, cy: 470}, {t: T.end, z: 1.18, cx: 400, cy: 492}], ease.out);
  svg.style.transform = `translate(${540 - C.cx * C.z}px,${1080 - C.cy * C.z}px) scale(${C.z})`;
  const fa = fanAngle(t, T.s4 + .3, 1.6, .5, 8);
  if (pv) pcUpdate(svg, {power: lerp(.15, 1, ease.out(prog(t, T.s4 + .2, T.s4 + 1.2))), ang: fa.ang, blur: clamp((fa.rps - 3) / 5), t, flow: t > T.s4 + .2 ? ((t - T.s4 - .2) * .9) % 1.7 : -1});
  if (pv) { const [px, py] = P(310, 300); [0, .2].forEach(d => ring(fx, px, py, prog(t, T.s4 + .3 + d, T.s4 + 1.6 + d), {r1: 1000})); sparkles(fx, t, T.s4 + .35, px, py, {n: 30, spread: 420, dur: 1.8, seed: 4}); }
  background(t, {mood: pv ? .5 + .5 * ease.out(prog(t, T.s4, T.s4 + 1.2)) : .8});
  A.anim(t, .5, 3.8, {stagger: .12}); B.anim(t, 4.5, 7.8, {stagger: .12}); L1.anim(t, 8.4, 11.8); Cc.anim(t, 8.5, 11.8, {stagger: .14}); E.anim(t, 12.7, 15.6, {stagger: .14});
  END(t);
  post(t, {fade: Math.max(1 - ease.out(prog(t, 0, .5)), ease.io(prog(t, T.end - .3, T.end)) * (t < T.end ? 1 : 0)), flash: .3 * Math.sin(Math.PI * prog(t, T.s4 + .3, T.s4 + .8))});
};
window.ready = async () => { await ready(); return {D}; };
</script></body></html>
