<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>AZOR — Reconhece?</title></head><body><div id="stage"></div>
<script type="module">
import {W, H, stage, background, post, headline, label, lockup, ring, sparkles, ready, keys, ease, prog, lerp, clamp, hash, sfx, $, el} from '/kit.js';
import {pcSVG, pcUpdate} from '/pc2d.js';
import {phone, bubble, chip, note} from '/ui.js';

const {fx} = stage(`
.bub{font-size:46px}
.dots{display:flex;gap:12px;padding:6px 4px}.dots i{width:16px;height:16px;border-radius:50%;background:#fff;display:block}
#cnt{position:absolute;right:84px;top:206px;font:500 24px GeistMono;letter-spacing:.22em;color:rgba(247,243,250,.55);z-index:50}
#cnt b{color:#ff7fe0;font-weight:500}
`);
const D = 22.0;
const T = {s2: 2.9, s3: 13.6, s4: 16.0, end: 19.4};
const PAIRS = [
  ['O FPS despenca do nada no meio da partida.', 'Frametime estável: serviços, Game DVR e agendamento da GPU no ponto.', 'A partir do Gamer'],
  ['A mira parece atrasada bem na hora do fight.', 'Menos input lag: mouse, MPO e timer acertados.', 'A partir do Pro'],
  ['Paguei memória de 3200 MHz e ela roda a 2133.', 'XMP ou EXPO ligado na BIOS: a RAM na velocidade que você pagou.', 'BIOS · Extremo'],
  ['Meu Windows vive lento e cheio de coisa que nunca abri.', 'Instalação limpa, leve e sem bloatware.', 'Windows otimizado'],
];
const SLOT = 2.65;
const cam = el('div', 'cam'); cam.style.zIndex = 10; cam.innerHTML = pcSVG();
const svg = cam.querySelector('svg'); svg.style.position = 'absolute'; svg.style.transformOrigin = '0 0';
const BUB = PAIRS.map(([me, az, tag], i) => {
  const t0 = T.s2 + .2 + i * SLOT;
  return {t0, me: bubble('me', `<small>Você</small>${me}`, 560), dots: bubble('az', '<div class="dots"><i></i><i></i><i></i></div>', 930),
    az: bubble('az', `<small>Azor <span class="tag">${tag.toUpperCase()}</span></small>${az}`, 900)};
});
const cnt = el('div', '', $('stage')); cnt.id = 'cnt';
const ph = phone('/shots_site/d_teste.png');
const A = headline('Reconhece|alguma <em>dessas?</em>', {top: 250, size: 128});
const L = label('O PROBLEMA <b>·</b> DE QUASE TODO MUNDO', {top: 200});
const B = headline('Não é falta de|PC bom. É <em>configuração.</em>', {top: 250, size: 92});
const Cc = headline('Descubra em|<em>1 minuto.</em>', {top: 230, size: 108});
const ch = chip('Diagnóstico grátis no site', {top: 500});
const nt = note('Site real da Azor Tweaks', 1790);
const END = lockup('PC afinado. Jogo liso.', 'TWEAKS').anim(T.end);

const pow = t => { let p = .12; BUB.forEach((b, i) => { p += .22 * ease.out(prog(t, b.t0 + .95, b.t0 + 1.6)); }); return Math.min(1, p); };
function spin(t) { let a = 0; const n = 240, dt = t / n; for (let i = 0; i < n; i++) a += lerp(.4, 8.5, pow((i + .5) * dt) ** 1.5) * dt; return a * Math.PI * 2; }

sfx(0, 'pad', .85, {d: D, chords: [[57, 64, 67, 71, 76], [55, 62, 66, 69, 74], [60, 64, 67, 71, 74], [57, 64, 69, 71, 76]]});
sfx(.4, 'air', .8); sfx(T.s2 - .2, 'whoosh', .6, {d: .9});
BUB.forEach(b => { sfx(b.t0, 'pop', .7); [0, .14, .28].forEach(d => sfx(b.t0 + .55 + d, 'tick', .45)); sfx(b.t0 + .95, 'pop', 1); sfx(b.t0 + 1.0, 'sparkle', .45, {d: .9}); });
sfx(T.s3 - .15, 'whoosh', .6, {d: .9}); sfx(T.s3 + .2, 'bloom', .9); sfx(T.s3 + .3, 'sparkle', .7, {d: 2});
sfx(T.s4 - .2, 'whoosh', .7, {d: 1}); sfx(T.s4 + .3, 'scan', .4, {d: 2.2}); sfx(T.s4 + .7, 'tick', .8);
sfx(T.end, 'whoosh', .5, {d: .9}); sfx(T.end + .5, 'tone', 1);

window.renderFrame = t => {
  fx.clearRect(0, 0, W, H);
  // PC ao fundo: começa apagado e acende a cada resposta
  const C = keys(t, [{t: 0, z: 1.3, cx: 400, cy: 470}, {t: T.s2, z: 1.2, cx: 400, cy: 440}, {t: T.s3, z: 1.12, cx: 400, cy: 430},
    {t: T.s4, z: 1.22, cx: 395, cy: 470}, {t: T.end, z: 1.0, cx: 400, cy: 360}], ease.sine);
  svg.style.transform = `translate(${540 - C.cx * C.z}px,${1080 - C.cy * C.z}px) scale(${C.z})`;
  const p = pow(t), back = ease.io(prog(t, T.s2 - .3, T.s2 + .4)) * (1 - ease.io(prog(t, T.s3 - .3, T.s3 + .3)));
  const ph_on = ease.io(prog(t, T.s4 - .1, T.s4 + .7));
  svg.style.filter = `blur(${(back * 9 + ph_on * 8).toFixed(1)}px) brightness(${(1 - back * .5 - ph_on * .45).toFixed(2)})`;
  pcUpdate(svg, {power: p, ang: spin(t), blur: clamp((p - .55) * 2.2), t, flow: t > T.s3 + .1 ? ((t - T.s3 - .1) * .9) % 1.7 : -1});
  background(t, {mood: .5 + .6 * p});
  // conversa
  BUB.forEach((b, i) => {
    const out = b.t0 + SLOT - .25;
    b.me.anim(t, b.t0, out); b.dots.anim(t, b.t0 + .5, b.t0 + .92); b.az.anim(t, b.t0 + .95, out);
    b.dots.querySelectorAll('i').forEach((d, j) => d.style.opacity = .35 + .65 * Math.max(0, Math.sin((t - b.t0) * 12 - j * .9)));
    // brilho saindo do balão da Azor
    const k = prog(t, b.t0 + .95, b.t0 + 1.9);
    if (k > 0 && k < 1) sparkles(fx, t, b.t0 + .95, 860, 960, {n: 18, spread: 260, dur: 1, seed: i + 3});
  });
  const ci = BUB.findIndex(b => t >= b.t0 && t < b.t0 + SLOT);
  cnt.style.opacity = ci >= 0 ? 1 : 0; if (ci >= 0) cnt.innerHTML = `<b>0${ci + 1}</b> / 04`;
  // virada: PC aceso
  const [px, py] = [540 + (310 - C.cx) * C.z, 1080 + (300 - C.cy) * C.z];
  [0, .2].forEach(d => ring(fx, px, py, prog(t, T.s3 + .1 + d, T.s3 + 1.4 + d), {r1: 1000}));
  sparkles(fx, t, T.s3 + .2, px, py, {n: 30, spread: 420, dur: 1.7, seed: 6});
  // celular com o diagnóstico real do site
  const pin = ease.expo(prog(t, T.s4, T.s4 + 1.0)), pout = ease.in(prog(t, T.end - .35, T.end));
  ph.set({x: 540, y: lerp(1900, 1210, pin), s: lerp(.86, .9, pin) * (1 + .06 * pout), ry: lerp(-14, -4, pin), rz: lerp(4, 0, pin), o: pin * (1 - pout),
    scroll: lerp(0, 980, ease.io(prog(t, T.s4 + .9, T.end - .4))), shine: prog(t, T.s4 + .5, T.s4 + 1.8)});
  A.anim(t, .4, 2.6, {stagger: .12}); L.anim(t, T.s2 + .1, T.s3 - .4);
  B.anim(t, T.s3 + .1, T.s4 - .4, {stagger: .12}); Cc.anim(t, T.s4 + .1, T.end - .4, {stagger: .12}); ch.anim(t, T.s4 + .6, T.end - .4); nt.anim(t, T.s4 + .8, T.end - .4);
  END(t);
  post(t, {fade: Math.max(1 - ease.out(prog(t, 0, .5)), ease.io(prog(t, T.end - .3, T.end)) * (t < T.end ? 1 : 0)), flash: .3 * Math.sin(Math.PI * prog(t, T.s3 + .1, T.s3 + .6))});
};
window.ready = async () => { await ready(); return {D}; };
</script></body></html>
