<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>AZOR — Potência que já era sua</title>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
</head><body><div id="stage"></div>
<script type="module">
import {THREE, W, H, createStage, mountType, headline, label, lockup, fontsReady, keys, ease, prog, lerp, clamp, sfx} from '/engine.js';
import {buildPanel, halo} from '/assets.js';
import {pcStudio} from '/pcscene.js';

mountType();
const st = createStage({bloom: [.42, .55, .9], exposure: .95});
const {scene, camera} = st;
const S = await pcStudio(st);
const D = 22.0;
const T = {s2: 4.2, s3: 8.4, click: 11.0, s4: 12.2, s5: 16.4, end: 19.0};

/* ---------- painel com a interface real ---------- */
const ui = new Image(); ui.src = '/shots/home_before.png'; await ui.decode();
const cv = document.createElement('canvas'); cv.width = 2048; cv.height = 1152;
const cx = cv.getContext('2d');
const uiTex = new THREE.CanvasTexture(cv); uiTex.colorSpace = THREE.SRGBColorSpace; uiTex.anisotropy = 8;
const PW = .36;
const panel = buildPanel(uiTex, PW, 16 / 9, {radius: .012, glow: .35});
const PANEL_POS = new THREE.Vector3(.04, .36, .72);
panel.group.position.copy(PANEL_POS);
panel.group.rotation.y = Math.atan2(.55 - .04, 2.55 - .72);
scene.add(panel.group);
const pulse = new THREE.Mesh(new THREE.RingGeometry(.96, 1, 128), new THREE.MeshBasicMaterial({color: 0xff4fd6, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false}));
const BOOST_UV = [435 / 1600, 360 / 900];
pulse.position.set((BOOST_UV[0] - .5) * PW, (.5 - BOOST_UV[1]) * panel.h, .004);
panel.group.add(pulse);
const S_UI = 2048 / 1600;
function drawUI(t) {
  cx.drawImage(ui, 0, 0, 2048, 1152);
  const k = ease.io(prog(t, 9.15, 10.55));
  const ux = lerp(1290, 446, k), uy = lerp(790, 378, k);
  const press = Math.max(0, 1 - Math.abs(t - T.click) / .09);
  cx.save(); cx.translate(ux * S_UI, uy * S_UI); cx.scale(1.55 * (1 - press * .15), 1.55 * (1 - press * .15));
  cx.beginPath(); cx.moveTo(0, 0); cx.lineTo(0, 22); cx.lineTo(5.5, 17); cx.lineTo(9.5, 26); cx.lineTo(13, 24.5); cx.lineTo(9, 15.8); cx.lineTo(16, 15.8); cx.closePath();
  cx.fillStyle = '#fff'; cx.strokeStyle = '#000'; cx.lineWidth = 1.3; cx.fill(); cx.stroke(); cx.restore();
  const rk = prog(t, T.click, T.click + .45);
  if (rk > 0 && rk < 1) { cx.strokeStyle = `rgba(255,255,255,${(1 - rk) * .9})`; cx.lineWidth = 5; cx.beginPath(); cx.arc(446 * S_UI, 378 * S_UI, (20 + rk * 150) * S_UI, 0, 6.283); cx.stroke(); }
  uiTex.needsUpdate = true;
}

/* ---------- câmera por plano ---------- */
const V = (x, y, z) => [x, y, z];
const SHOTS = [
  {a: 0, b: T.s2, k: [{t: 0, pos: V(.21, .13, .64), look: V(.0, .118, .18), fov: 26}, {t: T.s2, pos: V(.1, .15, .57), look: V(0, .122, .18), fov: 26}], ease: ease.sine},
  {a: T.s2, b: T.s3, k: [{t: T.s2, pos: V(1.98, .6, 3.2), look: V(0, .27, 0), fov: 22}, {t: T.s3, pos: V(1.64, .5, 2.64), look: V(0, .27, 0), fov: 22}], ease: ease.sine},
  {a: T.s3, b: T.s4, k: [
    {t: T.s3, pos: V(.6, .41, 2.62), look: V(.04, .36, .72), fov: 22},
    {t: 10.5, pos: V(.02, .382, 1.2), look: V(-.04, .378, .72), fov: 22, ease: ease.io},
    {t: T.click + .05, pos: V(.0, .38, 1.12), look: V(-.04, .378, .72), fov: 22},
    {t: T.s4, pos: V(1.5, .52, 2.5), look: V(0, .27, .05), fov: 22, ease: ease.ioExpo}]},
  {a: T.s4, b: T.s5, orbit: true},
  {a: T.s5, b: T.end + .3, k: [{t: T.s5, pos: V(.44, .372, .02), look: V(-.08, .372, -.118), fov: 24}, {t: T.end, pos: V(.36, .368, -.06), look: V(-.08, .372, -.118), fov: 24}], ease: ease.sine},
];
function setCam(t) {
  const sh = SHOTS.find(s => t >= s.a && t < s.b) || SHOTS[SHOTS.length - 1];
  let c;
  if (sh.orbit) {
    const k = ease.io(prog(t, sh.a, sh.b));
    const ang = lerp(.56, 1.25, k), r = lerp(3.05, 2.55, k);
    c = {pos: [Math.sin(ang) * r, lerp(.52, .44, k), Math.cos(ang) * r], look: [0, .27, 0], fov: 22};
  } else c = keys(t, sh.k, sh.ease || ease.io);
  camera.position.set(...c.pos); camera.lookAt(...c.look);
  if (camera.fov !== c.fov) { camera.fov = c.fov; camera.updateProjectionMatrix(); }
}

/* ---------- textos ---------- */
const A = headline('Seu PC tem mais|potência do que|ele <em>entrega.</em>', {top: 250, size: 98});
const B = headline('O Windows vem pronto|para <em class="w">qualquer</em> PC.', {top: 250, size: 86});
const C = headline('Não para o <em>seu.</em>', {top: 250, size: 112});
const L1 = label('AZOR OPTIMIZATION <b>·</b> 3.2', {top: 200});
const D1 = headline('115 ajustes, testados|e <em>reversíveis.</em>', {top: 250, size: 84});
const E = headline('<em>Um clique.</em>', {top: 250, size: 150, weight: 500});
const F = headline('Mais FPS.|Menos delay.|Menos <em>travadas.</em>', {top: 250, size: 104});
const G = headline('Potência que|já era <em>sua.</em>', {top: 250, size: 116});
const END = lockup('Potência que já era sua.');

/* ---------- som (desenho de som, sem música) ---------- */
sfx(0, 'amb', .9, {d: D}); sfx(0, 'drone', .55, {d: T.click + .2, f: 41}); sfx(0, 'fanidle', .5, {d: T.click + .5});
[.6, 4.6, 6.9, 8.7, 12.6, 16.7].forEach(t => sfx(t, 'air', .5));
sfx(T.s2, 'cut', .5); sfx(4.6, 'glint', .5); sfx(T.s3, 'panel', .6);
sfx(T.click - .9, 'swell', .7, {d: .9}); sfx(T.click, 'click', .9); sfx(T.click, 'impact', 1);
sfx(T.click + .1, 'powerup', .9, {d: 1.8}); sfx(T.click + .1, 'spinup', .8, {d: 7.5}); sfx(T.click + .2, 'drone', .7, {d: D - T.click - .2, f: 55, bright: 1});
sfx(T.s4, 'whoosh', .5, {d: 1.4}); sfx(T.s5, 'cut', .4); sfx(T.s5 + .2, 'shimmer', .45, {d: 2.4});
sfx(T.end, 'impact', .7, {soft: 1}); sfx(T.end + .7, 'tone', .55, {d: 2.6});

window.renderFrame = t => {
  setCam(t);
  S.power(t, T.click + .1, 1.5);
  S.fans(t, .55, 12, T.click + .15, 1.9);
  S.dust.material.uniforms.time.value = t;
  // reflexo de luz que varre o vidro no plano 2
  const gk = prog(t, 4.6, 6.8);
  S.glint.intensity = t > 4.5 && t < 7 ? 9 * Math.sin(Math.PI * gk) : 0;
  S.glint.position.set(lerp(-1.1, 1.3, ease.io(gk)), .45, 1.05); S.glint.lookAt(0, .3, 0);
  // painel de interface
  const pin = ease.expo(prog(t, T.s3 + .05, T.s3 + .9)), pout = ease.in(prog(t, T.click + .25, T.click + .85));
  const pv = t >= T.s3 && t < T.click + .9;
  panel.group.visible = pv;
  if (pv) {
    drawUI(t);
    panel.mat.opacity = pin * (1 - pout);
    panel.group.children.forEach(c => { if (c.material && c.material !== panel.mat && c !== pulse) c.material.opacity = (c.material.userData.o ??= c.material.opacity) * pin * (1 - pout); });
    panel.group.scale.setScalar(lerp(.94, 1, pin) * lerp(1, 1.06, pout));
    const rk = prog(t, T.click, T.click + 1.1);
    pulse.scale.setScalar(.01 + ease.out(rk) * 1.8);
    pulse.material.opacity = rk > 0 && rk < 1 ? (1 - rk) * .9 : 0;
  }
  // brilho extra no despertar
  st.bloom.strength = .42 + .25 * Math.sin(Math.PI * prog(t, T.click + .1, T.click + 1.8));
  // textos
  A.anim(t, .6, 3.7); B.anim(t, 4.6, 6.6); C.anim(t, 6.9, 8.1);
  L1.anim(t, 8.6, 9.75); D1.anim(t, 8.7, 9.75); E.anim(t, T.click + .02, 12.0, {dur: .7});
  F.anim(t, 12.6, 15.9, {stagger: .16}); G.anim(t, 16.7, 18.6, {stagger: .12});
  // fim: escurece o 3D e entra a assinatura
  st.grade.uniforms.fade.value = Math.max(ease.io(prog(t, T.end - .35, T.end + .05)), 1 - ease.out(prog(t, 0, .6)));
  END.anim(t, T.end);
  st.render(t);
};
window.ready = async () => { await fontsReady(); return {D}; };
</script></body></html>
