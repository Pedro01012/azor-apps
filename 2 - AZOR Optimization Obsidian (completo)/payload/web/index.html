<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>AZOR Optimization</title>
  <!--AZOR_TOKEN-->
  <link rel="stylesheet" href="styles.css?build=obsidian-2" />
  <link rel="stylesheet" href="input-studio.css?build=obsidian-2" />
  <link rel="stylesheet" href="azor-theme.css?build=obsidian-2" />
</head>
<body>
  <div id="app" class="app-shell">
    <aside class="sidebar glass">
      <div class="brand">
        <div class="brand-mark"><img src="assets/Azor_icon.png" alt="Azor"></div>
        <div><b>AZOR</b><span>OPTIMIZATION</span></div>
      </div>
      <nav id="nav" aria-label="Navegação principal"></nav>
      <div class="sidebar-foot">
        <div class="profile-dot" aria-hidden="true"></div>
        <div><strong>Azor Engine</strong><small id="engineStatus">Inicializando…</small></div>
      </div>
    </aside>

    <section class="workspace">
      <header class="topbar glass">
        <div class="crumb"><span class="dot-live"></span><span id="topStatus">PC Online</span></div>
        <div class="top-chips">
          <span class="chip" id="modeChip">Modo: Simples</span>
          <span class="chip" id="windowsChip">Windows</span>
          <span class="chip" id="adminChip">Modo padrão</span>
          <span class="chip chip-clock" id="clockChip">--:--</span>
        </div>
      </header>
      <main id="view" class="view" tabindex="-1"></main>
    </section>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="modal" class="modal-backdrop hidden"><div class="modal glass" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><button class="modal-close" id="modalClose" type="button" aria-label="Fechar">×</button><div id="modalBody"></div></div></div>
  <script src="performance-center.js?build=obsidian-2"></script>
  <script src="app.js?build=obsidian-2"></script>
</body>
</html>
